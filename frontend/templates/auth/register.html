<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body><a class="skip-link" href="#main">Skip to form</a><main class="auth-page" id="main"><section class="auth-scene"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span>Smart EV</a><div><p class="eyebrow">Driver setup</p><h2>Know before you plug in.</h2><p class="muted">Save reliable stations and contribute after each visit.</p></div></section>
<section class="auth-form-wrap"><div class="auth-form"><p class="eyebrow">Create account</p><h1>Start driving</h1><p class="muted">Three details. No location permission required.</p><form id="registration-form" novalidate><label class="field"><span>Name</span><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="100"><small class="muted">How your name appears on reviews.</small></label><label class="field"><span>Email</span><input id="email" name="email" type="email" autocomplete="email" required maxlength="255"></label><label class="field"><span>Password</span><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="64"><small class="muted">8–64 characters with at least one letter and number.</small></label><button class="button" type="submit">Create account</button><div id="registration-message" class="message" role="status" aria-live="polite" tabindex="-1"></div></form><p class="muted">Already registered? <a href="/login">Sign in</a></p></div></section></main><script type="module" th:src="@{/js/pages/register.js}" th:attr="nonce=${cspNonce}"></script></body></html>
