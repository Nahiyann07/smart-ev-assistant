spring.application.name=smart-ev-assistant
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.web.resources.cache.cachecontrol.no-store=true

app.google-maps.browser-key=${GOOGLE_MAPS_BROWSER_KEY:}
app.google-maps.map-id=${GOOGLE_MAP_ID:}
app.google-maps.routes-server-key=${GOOGLE_ROUTES_SERVER_KEY:}

app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:10000}
app.security.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.security.rate-limit.login.window=${LOGIN_RATE_LIMIT_WINDOW:15m}
app.security.rate-limit.registration.max-attempts=${REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:10}
app.security.rate-limit.registration.window=${REGISTRATION_RATE_LIMIT_WINDOW:1h}
app.security.rate-limit.routes.max-attempts=${ROUTE_RATE_LIMIT_MAX_ATTEMPTS:30}
app.security.rate-limit.routes.window=${ROUTE_RATE_LIMIT_WINDOW:1m}
