spring.datasource.url=jdbc:h2:mem:smart_ev_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.thymeleaf.cache=false
server.servlet.session.cookie.secure=false

app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}
app.demo.driver-email=${DEMO_DRIVER_EMAIL:}
app.demo.driver-password=${DEMO_DRIVER_PASSWORD:}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
