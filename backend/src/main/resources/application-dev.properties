spring.thymeleaf.cache=false
logging.level.com.smartev.assistant=DEBUG

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_ev_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smart_ev_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
